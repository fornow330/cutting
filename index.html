  function boot(msg){
    var el=document.getElementById('boot');
    if(!el) return;
    el.innerHTML='<div class="t">'+msg+'</div>';
  }
  async function gunzip(u8){
    var ds = new DecompressionStream('gzip');
    var out = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(out);
  }
  async function decryptToObj(gz){
    var pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)}, await crypto.subtle.importKey('raw',b64(P),'AES-GCM',false,['decrypt']), gz);
    return JSON.parse(new TextDecoder().decode(await gunzip(pt)));
  }
  function practice(){
    var cv = document.getElementById('pre');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var tx = 0, ty = 0, px = 0, py = 0, t = 0, alive = true;
    function size(){
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      if (!tx && !ty){ tx = W/2; ty = H*0.62; px = tx; py = ty; }
    }
    size();
    window.addEventListener('resize', size);
    window.addEventListener('pointermove', function(e){ tx = e.clientX; ty = e.clientY; }, {passive:true});
    window.addEventListener('pointerdown', function(e){ tx = e.clientX; ty = e.clientY; }, {passive:true});
    function loop(){
      if (!alive) return;
      t += 0.016;
      px += (tx - px) * 0.12;
      py += (ty - py) * 0.12;
      ctx.fillStyle = '#080d10'; ctx.fillRect(0,0,W,H);
      var g = 46, ox = (t*14) % g, oy = (t*10) % g;
      ctx.strokeStyle = 'rgba(94,230,200,0.065)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (var x=-g; x<W+g; x+=g){ ctx.moveTo(x+ox,0); ctx.lineTo(x+ox,H); }
      for (var y=-g; y<H+g; y+=g){ ctx.moveTo(0,y+oy); ctx.lineTo(W,y+oy); }
      ctx.stroke();
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = 'rgba(94,230,200,0.16)';
      ctx.beginPath(); ctx.arc(0,0,30,0,6.28); ctx.fill();
      ctx.fillStyle = '#5ee6c8';
      ctx.beginPath();
      ctx.moveTo(0,-13); ctx.lineTo(10,9); ctx.lineTo(0,4); ctx.lineTo(-10,9); ctx.closePath();
      ctx.fill();
      ctx.restore();
      requestAnimationFrame(loop);
    }
    loop();
    return function(){ alive = false; window.removeEventListener('resize', size); if (cv.parentNode) cv.parentNode.removeChild(cv); };
  }
  var stopPractice = practice();
  function mount(obj){
    if (stopPractice) stopPractice();
    var st = document.createElement('style'); st.textContent = obj.css; document.head.appendChild(st);
    document.body.innerHTML = obj.body;
    var sc = document.createElement('script'); sc.textContent = obj.js; document.body.appendChild(sc);
  }
  function readCache(){
    try {
      var v = localStorage.getItem(CK);
      if (!v) return null;
      var o = JSON.parse(v);
      return (o && o.k && o.d) ? o : null;
    } catch(e){ return null; }
  }
  function dropOldCaches(){
    try {
      var keys = [];
      for (var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if (!k) continue;
        if (k.indexOf('gzpk_') === 0 && k !== CK) keys.push(k);
      }
      for (var j=0;j<keys.length;j++) localStorage.removeItem(keys[j]);
    } catch(e){}
  }
  function writeCache(gz){
    var s = null;
    try { s = JSON.stringify({k:P, d:toB64(gz)}); } catch(e){ return; }
    if (s.length >= 900000) return;
    try { localStorage.setItem(CK, s); return; } catch(e){}
    /* 配额不足：先清掉旧版本缓存，再重试一次 */
    dropOldCaches();
    try { localStorage.removeItem(CK); localStorage.setItem(CK, s); } catch(e){}
  }
  dropOldCaches();
  function ready(obj){ return obj && obj.js && obj.css && obj.body; }
  try {
    var hit = readCache();
    if (hit){
      try {
        P = hit.k;
        var cachedObj = await decryptToObj(b64(hit.d));
        if (ready(cachedObj)){ mount(cachedObj); return; }
      } catch(e){ P = ''; }
    }
    var JSD = 'https://cdn.jsdelivr.net/gh/fornow330/cutting@main/chunks/';
    function fetchOne(url, timeout, cacheMode){
      return Promise.race([
        fetch(url, {cache:cacheMode}),
        new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, timeout); })
      ]);
    }
    async function loadSet(fromJsdelivr, timeout, cacheMode, bust){
      var list = [];
      for (var i=N-1; i>=0; i--){
        var name='q'+String(i).padStart(2,'0')+'.bin';
        var url = fromJsdelivr ? (JSD+name) : ('chunks/'+name+'?v='+VER+(bust?('&r='+Date.now()):''));
        list.push({i:i, url:url});
      }
      var out = new Array(N);
      await Promise.all(list.map(async function(it){
        var text = null;
        try { var r = await fetchOne(it.url, timeout, cacheMode); if (r.ok) text = await r.text(); } catch(e){}
        if (!text) throw new Error('chunk '+it.i);
        out[it.i] = text;
      }));
      return out;
    }

    var chunks = null;
    if (window.__CK && window.__CK.length === N) chunks = window.__CK;
    if (!chunks){
      try { chunks = await loadSet(false, 6000, 'force-cache', false); }
      catch(e0){
        try { chunks = await loadSet(true, 8000, 'reload', false); }
        catch(e1){ chunks = await loadSet(false, 9000, 'reload', true); }
      }
    }
    var frags = [], segs = [];
    for (var ci=0; ci<N; ci++){
      var cut = chunks[ci].indexOf('\n');
      frags.push(chunks[ci].slice(0, cut));
      segs.push(chunks[ci].slice(cut+1));
    }
    async function assemble(cs){
      var fr=[], sg=[];
      for (var ci=0; ci<N; ci++){ var cut=cs[ci].indexOf('\n'); fr.push(cs[ci].slice(0,cut)); sg.push(cs[ci].slice(cut+1)); }
      P = fr.join('');
      return b64(sg.join('').replace(/\s+/g,''));
    }
    var gz = await assemble(chunks);
    var obj = null;
    try { obj = await decryptToObj(gz); }
    catch(eDec){
      if (!window.__CK) chunks = await loadSet(false, 9000, 'reload', true);
      gz = await assemble(chunks);
      obj = await decryptToObj(gz);
    }
    writeCache(gz);
    if (ready(obj)) mount(obj); else boot('加载失败，请刷新重试');
  } catch(e) {
    boot('加载失败，请刷新重试');
    console.error(e);
  }
})();
</script>
