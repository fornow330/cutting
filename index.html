<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>怪潮幸存者</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1518'/%3E%3Cpath d='M16 6l8 11-8 9-8-9z' fill='%235ee6c8'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#0a1013;color:#7fd8c8;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#boot .bar{width:150px;height:4px;border-radius:2px;background:#16302c;overflow:hidden}
#boot .bar i{display:block;height:100%;width:33%;background:#5ee6c8;animation:s 1.1s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
#boot .t{letter-spacing:.18em;font-size:12px;opacity:.75}
</style>
</head>
<body>
<div id="boot"><div class="bar"><i></i></div><div class="t">正在解包</div></div>
<script>
(async function(){
  var P = "";
  var IV = "GX4leP2c/Ro9wcde";
  var N = 4;
  var CK = "gzpk_79921affce";
  function b64(s){var t=atob(s),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u;}
  function toB64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
  function boot(msg){
    var el=document.getElementById('boot');
    if(!el) return;
    el.innerHTML='<div class="t">'+msg+'</div>';
  }
  async function gunzip(u8){
    var ds = new DecompressionStream('gzip');
    var out = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(out);
  }
  async function decryptToObj(gz){
    var pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)}, await crypto.subtle.importKey('raw',b64(P),'AES-GCM',false,['decrypt']), gz);
    return JSON.parse(new TextDecoder().decode(await gunzip(pt)));
  }
  function mount(obj){
    var st = document.createElement('style'); st.textContent = obj.css; document.head.appendChild(st);
    document.body.innerHTML = obj.body;
    var sc = document.createElement('script'); sc.textContent = obj.js; document.body.appendChild(sc);
  }
  function readCache(){
    try {
      var v = localStorage.getItem(CK);
      if (!v) return null;
      var o = JSON.parse(v);
      return (o && o.k && o.d) ? o : null;
    } catch(e){ return null; }
  }
  function writeCache(gz){
    try {
      var s = JSON.stringify({k:P, d:toB64(gz)});
      if (s.length < 900000) localStorage.setItem(CK, s);
    } catch(e){}
  }
  function ready(obj){ return obj && obj.js && obj.css && obj.body; }
  try {
    var hit = readCache();
    if (hit){
      try {
        P = hit.k;
        var cachedObj = await decryptToObj(b64(hit.d));
        if (ready(cachedObj)){ mount(cachedObj); return; }
      } catch(e){ P = ''; }
    }
    async function getChunk(i){
      var url='chunks/q'+String(i).padStart(2,'0')+'.bin';
      for(var t=0;t<4;t++){
        try {
          var r = await Promise.race([
            fetch(url, {cache:'force-cache'}),
            new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, 8000); })
          ]);
          if (r.ok) return await r.text();
        } catch(e){}
        await new Promise(function(res){ setTimeout(res, 700*(t+1)); });
      }
      throw new Error('chunk '+i);
    }
    var idxs = [];
    for (var i=N-1; i>=0; i--) idxs.push(i);
    var chunks = new Array(N);
    await Promise.all(idxs.map(async function(i){ chunks[i] = await getChunk(i); }));
    var frags = [], segs = [];
    for (var ci=0; ci<N; ci++){
      var cut = chunks[ci].indexOf('\n');
      frags.push(chunks[ci].slice(0, cut));
      segs.push(chunks[ci].slice(cut+1));
    }
    P = frags.join('');
    var b64all = segs.join('').replace(/\s+/g,'');
    var gz = b64(b64all);
    var obj = await decryptToObj(gz);
    writeCache(gz);
    if (ready(obj)) mount(obj); else boot('加载失败，请刷新重试');
  } catch(e) {
    boot('加载失败，请刷新重试');
    console.error(e);
  }
})();
</script>
</body>
</html>
